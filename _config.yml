# DSPIRA lessons — site configuration.
#
# The site is built by GitHub Pages, which runs Jekyll 3.9 through the
# github-pages gem. Anything that needs a newer Jekyll, or a plugin outside the
# Pages allowlist, will fail the build silently: Pages emails the repository
# owner and keeps serving the last good copy, so the site simply stops updating.

title:       DSPIRA
tagline:     Digital Signal Processing in Radio Astronomy
description: >-
  Free lessons on building and using a horn radio telescope — the antenna, the
  amplifier, the software-defined radio and the astronomy. Written by the high
  school teachers of the DSPIRA program at West Virginia University.
email:       wvurail@gmail.com
author:      WVU Radio Astronomy Instrumentation Laboratory

# Copied verbatim from the lab site's _config.yml (rail-site), comment and all:
# the lab and the lessons share one address, so keep the two files in step.
# There is no /contact/ page here; the footer is this block's only reader.
# The lab's contact block. Rendered in the footer of every page and on
# /contact/, from this one place so the two cannot disagree. WVU's Common
# Elements rule wants physical address, mailing address, email, phone and fax
# on every page. Street and mailing address are the Lane Department's, as
# published at lcsee.statler.wvu.edu (the AERB is 1220 Evansdale Drive per WVU
# Facilities Planning — not 1306, which is the Engineering Sciences Building).
# The phone is the PI's office line, as the old contact page listed it; the
# fax is the department's, since the lab has none of its own.
contact:
  building: Advanced Engineering Research Building, Room 304
  street: 1220 Evansdale Drive
  mailing: PO Box 6109
  city: Morgantown
  state: WV
  zip: "26506-6109"
  phone: "(304) 293-9686"
  phone_tel: "+13042939686"
  fax: "(304) 293-8602"
  fax_note: Lane Department

baseurl:     "/dspira-lessons"

# The lab site is a SEPARATE GitHub Pages site sharing this host at its root.
# Its paths must not take this site's baseurl (that would give
# /dspira-lessons/lightwork/), and they must still work under the staging
# prefix, so they are written as {{ site.lab_url }}/lightwork/ rather than as
# bare root-absolute paths. At cutover this stays empty: rail.wvu.edu serves
# the lab site at its root exactly as wvurail.org does today.
lab_url: ""
# THE CUTOVER SWITCH. Serving does not read this (the domain is inherited from
# the org site's CNAME); canonicals, og:url, the sitemap and the feed do. Change
# to https://rail.wvu.edu in the same commit as the org repo's CNAME move — the
# full checklist is .github/CUTOVER.md in wvurail.github.io.
url:         "https://wvurail.org"
date_format: "%B %-d, %Y"

github_username: WVURAIL

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
permalink: :title
sass:
  style: compressed
plugins:
  - jekyll-sitemap

# The exported notebook at code/gbt_drift/gbt_rendered_2017.html is a 1.5 MB
# static file with no front matter, so Liquid never runs in it: it cannot be
# given the conditional robots meta that _includes/head.html writes for every
# page that does go through a layout, and a staging copy served from another
# path would therefore be indexable. Keeping it out of the sitemap is the only
# lever left, and jekyll-sitemap reads `sitemap: false` off a static file via
# front matter defaults. Nothing is lost by omitting it: it is reachable only
# from code/gbt_drift/index.html, which is itself in the sitemap. (/iq/, the
# other standalone export, asks for the same in its own front matter, which it
# can do because it has some.)
defaults:
  - scope:
      path: "code/gbt_drift/gbt_rendered_2017.html"
    values:
      sitemap: false

# The READMEs under code/, tools/ and images/programme/ carry no front matter,
# so the github-pages gem's own plugins publish them: as pages
# (optional-front-matter), at their directory's index (readme-index), in the
# `page` layout (default-layout), titled from their opening "# Heading"
# (titles-from-headings). The layout writes that title as the page's h1, so
# unless the heading is stripped from the body it renders a second time and
# each of those pages has two h1s — which .github/workflows/build.yml rejects.
# Stripping changes nothing on GitHub, where the heading is still wanted.
titles_from_headings:
  strip_title: true

exclude:
  # Belt and braces with .gitignore: if one of these is ever committed again it
  # still must not reach _site, or the artifact upload fails on the colon.
  - "*:Zone.Identifier"
  - Gemfile
  - Gemfile.lock
  - Gemfile.ci
  - Gemfile.ci.lock
  - README.md
  - CONTRIBUTING.md
  - vendor
  # Written at the top of the checkout by tools/check_links.py. It is
  # gitignored, but a build after a local run would otherwise publish it.
  - link-report.md
